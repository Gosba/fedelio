<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Affiche carte de fidélité</title>
<link rel="stylesheet" href="/app.css">
<style>
@page{size:A4;margin:0}
body{background:#ddd}
.sheet{width:210mm;min-height:297mm;margin:20px auto;background:var(--c,#0f5132);color:#fff;padding:22mm 18mm;display:flex;flex-direction:column;align-items:center;text-align:center;gap:8mm;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.sheet h1{font-size:44pt;margin:0;line-height:1}
.sheet .sub{font-size:18pt;opacity:.9;max-width:150mm}
.qr{background:#fff;border-radius:10mm;padding:9mm;width:110mm;box-shadow:0 0 0 4mm var(--a,#ffc845)}
.qr img{width:100%;display:block}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:6mm;width:100%;font-size:13pt}
.steps b{display:grid;place-items:center;width:12mm;height:12mm;border-radius:50%;background:var(--a,#ffc845);color:var(--c,#0f5132);margin:0 auto 3mm;font-size:16pt}
.reward{background:var(--a,#ffc845);color:var(--c,#0f5132);border-radius:999px;padding:4mm 10mm;font-weight:800;font-size:18pt}
.small{font-size:11pt;opacity:.8;margin-top:auto}
.tools{text-align:center;padding:16px}
@media screen and (max-width:820px){.sheet{transform-origin:top center;transform:scale(calc(100vw / 860px));margin-bottom:calc(297mm * (100vw / 860px - 1))}}
@media print{body{background:none}.tools{display:none}.sheet{margin:0;box-shadow:none;-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style></head><body>
<div class="tools"><button class="btn em" onclick="print()" type="button">Imprimer l'affiche</button></div>
<div class="sheet" id="sheet"><h1>Chargement…</h1></div>
<script src="/common.js"></script>
<script>
{
const slug = location.pathname.split('/')[2];
api('/api/s/' + encodeURIComponent(slug)).then(s => {
  const el = $('#sheet'); el.style.setProperty('--c', s.color); el.style.setProperty('--a', s.accent);
  el.innerHTML = `<h1>${esc(s.name)}</h1><div class="sub">Votre carte de fidélité, directement sur votre téléphone</div>
    <div class="qr"><img src="/api/s/${encodeURIComponent(slug)}/qr.svg" alt="QR code"></div>
    <div class="reward">${esc(s.goal)} ${esc(s.stampLabel)}s = ${esc(s.reward)}</div>
    <div class="steps"><div><b>1</b>Scannez le QR code avec l'appareil photo</div><div><b>2</b>Votre carte s'ouvre, sans inscription</div><div><b>3</b>À chaque passage, faites valider en caisse</div></div>
    <div class="small">Aucune donnée personnelle demandée · ${esc(location.host)}/s/${esc(slug)}</div>`;
  document.title = 'Affiche — ' + s.name;
}).catch(e => $('#sheet').innerHTML = `<h1>${esc(e.message)}</h1>`);
}
</script>
</body></html>
